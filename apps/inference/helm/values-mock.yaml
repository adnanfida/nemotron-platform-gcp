# Mock profile — CPU stub container, no GPU. ~$80/month total when used
# with the dev Terraform env. Validates the K8s wiring (Service, HPA, PDB,
# PodMonitoring) without any model code.

replicaCount: 2

image:
  repository: ghcr.io/adnanfida/nemotron-mock
  tag: "latest"
  pullPolicy: Always

# Fast probes — the mock starts in <5s.
probes:
  enabled: true
  startup:
    httpGet:
      path: /v1/health/ready
      port: 8000
    periodSeconds: 5
    failureThreshold: 6
  readiness:
    httpGet:
      path: /v1/health/ready
      port: 8000
    periodSeconds: 10
  liveness:
    httpGet:
      path: /v1/health/live
      port: 8000
    periodSeconds: 30

# HPA on CPU (the mock isn't GPU-bound). For end-to-end testing of the
# external-metric path, flip metric.type to "external" once the metrics
# adapter is installed.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metric:
    type: cpu
    targetCPUUtilization: 80

pdb:
  enabled: true
  minAvailable: 1

metrics:
  enabled: true

service:
  type: ClusterIP
  port: 8000
  negEnabled: true
  sessionAffinity: false
